name: PR Compliance Pipeline

on:
  push:
  workflow_dispatch:
    inputs:
      workload_dir:
        description: Terraform workload directory to validate and scan
        required: false
        default: Internal-IT/workloads/ayka-portal

env:
  WORKLOAD_DIR: ${{ github.event.inputs.workload_dir || 'Internal-IT/workloads/ayka-portal' }}
  REGRESSION_DIR: Internal-IT/workloads/control-validation-scenarios
  AWS_REGION: ap-south-1
  AWS_ROLE_ARN: arn:aws:iam::982081090103:role/github-actions-oidc-role
  TERRAFORM_VERSION: 1.7.5

permissions:
  id-token: write
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Terraform Validate
        uses: ./.github/actions/validate
        with:
          workload_dir: ${{ env.WORKLOAD_DIR }}
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Validate CI shell scripts
        run: |
          for file in Internal-IT/engineering/ci-cd/scripts/*.sh; do
            bash -n "$file"
          done

  compliance:
    needs: validate
    runs-on: ubuntu-latest
    outputs:
      schema_version: ${{ steps.evaluate.outputs.schema_version }}
      decision: ${{ steps.evaluate.outputs.decision }}
      approval_required: ${{ steps.evaluate.outputs.approval_required }}
      unmapped_findings: ${{ steps.evaluate.outputs.unmapped_findings }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Terraform Plan
        uses: ./.github/actions/plan
        with:
          workload_dir: ${{ env.WORKLOAD_DIR }}
          aws_role_arn: ${{ env.AWS_ROLE_ARN }}
          aws_region: ${{ env.AWS_REGION }}
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Security Scan
        uses: ./.github/actions/scan

      - name: Evaluate Compliance
        id: evaluate
        uses: ./.github/actions/evaluate

  regression:
    name: Control Validation Regression
    runs-on: ubuntu-latest
    # Only run regression if we're not already running it as the primary workload
    if: ${{ github.event.inputs.workload_dir != 'Internal-IT/workloads/control-validation-scenarios' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Terraform Validate (Regression)
        uses: ./.github/actions/validate
        with:
          workload_dir: ${{ env.REGRESSION_DIR }}
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Terraform Plan (Regression)
        uses: ./.github/actions/plan
        with:
          workload_dir: ${{ env.REGRESSION_DIR }}
          aws_role_arn: ${{ env.AWS_ROLE_ARN }}
          aws_region: ${{ env.AWS_REGION }}
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Security Scan (Regression)
        uses: ./.github/actions/scan

      - name: Evaluate Compliance (Regression)
        id: evaluate_regression
        uses: ./.github/actions/evaluate
        continue-on-error: true

      - name: Check Regression Results
        shell: bash
        run: |
          DECISION="${{ steps.evaluate_regression.outputs.decision }}"
          echo "Regression Decision: $DECISION"
          
          if [ "$DECISION" == "error" ] || [ -z "$DECISION" ]; then
            echo "Regression evaluation produced an error or no decision."
            exit 1
          fi
          
          if [ "$DECISION" == "fail" ]; then
            echo "SUCCESS: Regression suite correctly identified security violations (Negative testing verified)."
          else
            echo "WARNING: Regression suite did not return 'fail'. Current decision: $DECISION"
          fi

  medium-risk-approval:
    needs: compliance
    if: ${{ needs.compliance.outputs.approval_required == 'true' }}
    runs-on: ubuntu-latest
    environment:
      name: medium-risk-approval
    steps:
      - name: Await Manual Approval
        run: |
          echo "Medium severity findings require manual approval."
          echo "Compliance decision: ${{ needs.compliance.outputs.decision }}"
          echo "Summary schema version: ${{ needs.compliance.outputs.schema_version }}"
          echo "Unmapped findings: ${{ needs.compliance.outputs.unmapped_findings }}"
