name: 'Security Scan'
description: 'Install security tools and run Checkov, tfsec, and OPA scans'

inputs:
  plan_json_path:
    description: 'Path to the Terraform plan JSON file'
    required: false
    default: 'output/tfplan.json'

runs:
  using: 'composite'
  steps:
    - name: Setup Python (for Checkov)
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install dependencies
      shell: bash
      run: |
        pip install checkov

        # Install Conftest (OPA runner)
        wget https://github.com/open-policy-agent/conftest/releases/download/v0.45.0/conftest_0.45.0_Linux_x86_64.tar.gz
        tar xzf conftest_*.tar.gz
        sudo mv conftest /usr/local/bin

        # Install tfsec
        wget https://github.com/aquasecurity/tfsec/releases/download/v1.28.14/tfsec-linux-amd64
        chmod +x tfsec-linux-amd64
        sudo mv tfsec-linux-amd64 /usr/local/bin/tfsec

    - name: Install jq
      shell: bash
      run: sudo apt-get install -y jq

    - name: Run Checkov
      shell: bash
      run: bash Internal-IT/engineering/ci-cd/scripts/run-checkov.sh

    - name: Run tfsec
      shell: bash
      run: bash Internal-IT/engineering/ci-cd/scripts/run-tfsec.sh

    - name: Run OPA (Conftest)
      shell: bash
      run: bash Internal-IT/engineering/ci-cd/scripts/run-policy-check.sh
