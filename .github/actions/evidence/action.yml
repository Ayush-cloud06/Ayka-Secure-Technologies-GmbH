name: 'Compliance Evidence'
description: 'Generate report and export artifacts'

inputs:
  artifact_name:
    description: 'Name of the uploaded artifact'
    required: false
    default: 'compliance-evidence'
  workload_dir:
    description: 'Terraform workload directory, recorded in the run manifest'
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    - name: 📝 Generate Human-Readable Report
      if: always()
      shell: bash
      run: python3 Internal-IT/engineering/ci-cd/scripts/generate-report.py

    - name: Export Evidence
      if: always()
      shell: bash
      run: bash Internal-IT/engineering/ci-cd/scripts/export-evidence.sh

    - name: Write Run Manifest
      if: always()
      shell: bash
      env:
        WORKLOAD_DIR: ${{ inputs.workload_dir }}
      run: python3 Internal-IT/engineering/ci-cd/scripts/write-manifest.py

    - name: Checksum Artifacts
      if: always()
      shell: bash
      run: bash Internal-IT/engineering/ci-cd/scripts/checksum-evidence.sh

    - name: Upload Evidence Artifact
      if: always()
      uses: actions/upload-artifact@26f96dfa697d77e81fd5907df203aa23a56210a8 # v4.3.0
      with:
        name: ${{ inputs.artifact_name }}
        path: |
          evidence/
          output/
