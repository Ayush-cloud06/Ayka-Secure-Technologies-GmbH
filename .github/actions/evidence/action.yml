name: 'Compliance Evidence'
description: 'Generate report and export artifacts'

inputs:
  artifact_name:
    description: 'Name of the uploaded artifact'
    required: false
    default: 'compliance-evidence'
  workload_dir:
    description: 'Terraform workload directory, recorded in the run manifest'
    required: false
    default: ''
  scan_mode:
    description: 'plan or source, recorded in the run manifest'
    required: false
    default: 'plan'

runs:
  using: 'composite'
  steps:
    - name: 📝 Generate Human-Readable Report
      if: always()
      shell: bash
      run: python3 Internal-IT/engineering/ci-cd/scripts/generate-report.py

    - name: Export Evidence
      if: always()
      shell: bash
      run: bash Internal-IT/engineering/ci-cd/scripts/export-evidence.sh

    - name: Write Run Manifest
      if: always()
      shell: bash
      env:
        WORKLOAD_DIR: ${{ inputs.workload_dir }}
        COMPLIANCE_SCAN_MODE: ${{ inputs.scan_mode }}
      run: python3 Internal-IT/engineering/ci-cd/scripts/write-manifest.py

    - name: Checksum Artifacts
      if: always()
      shell: bash
      run: bash Internal-IT/engineering/ci-cd/scripts/checksum-evidence.sh

    - name: Upload Evidence Artifact
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: ${{ inputs.artifact_name }}
        # 90 days is the most GitHub keeps for a public repository; stated here so a
        # change of the repository default cannot shorten it unnoticed.
        retention-days: 90
        path: |
          evidence/
          output/
