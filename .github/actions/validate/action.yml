name: 'Terraform Validate'
description: 'Standardized Terraform formatting, validation, and linting'

inputs:
  workload_dir:
    description: 'Directory containing the Terraform workload'
    required: true
  terraform_version:
    description: 'Version of Terraform to use'
    required: false
    default: '1.7.5'

runs:
  using: 'composite'
  steps:
    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: ${{ inputs.terraform_version }}

    - name: Setup TFLint
      uses: terraform-linters/setup-tflint@v4
      with:
        tflint_version: latest

    - name: Terraform fmt check
      shell: bash
      run: terraform fmt -check -recursive "${{ inputs.workload_dir }}"

    - name: Terraform init for validation
      shell: bash
      working-directory: ${{ inputs.workload_dir }}
      run: terraform init -backend=false -input=false

    - name: Terraform validate
      shell: bash
      working-directory: ${{ inputs.workload_dir }}
      run: terraform validate

    - name: TFLint
      shell: bash
      working-directory: ${{ inputs.workload_dir }}
      run: tflint --init && tflint --recursive
