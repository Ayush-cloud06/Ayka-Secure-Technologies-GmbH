name: 'Terraform Plan'
description: 'Plan-only Terraform run with mock credentials and JSON export'

inputs:
  workload_dir:
    description: 'Directory containing the Terraform workload'
    required: true
  terraform_version:
    description: 'Version of Terraform to use'
    required: false
    default: '1.7.5'

runs:
  using: 'composite'
  steps:
    - name: Setup Terraform
      uses: hashicorp/setup-terraform@a1502cd9e758c50496cc9ac5308c4843bcd56d36 # v3.0.0
      with:
        terraform_version: ${{ inputs.terraform_version }}

    - name: Terraform init
      shell: bash
      working-directory: ${{ inputs.workload_dir }}
      run: terraform init -input=false

    - name: Terraform Plan
      shell: bash
      working-directory: ${{ inputs.workload_dir }}
      env:
        # ADR-0013: plan-only work never logs in to AWS. The provider's skip_* flags
        # stop it from calling AWS; these values only satisfy its credential check.
        AWS_ACCESS_KEY_ID: mock
        AWS_SECRET_ACCESS_KEY: mock
        AWS_EC2_METADATA_DISABLED: "true"
      run: terraform plan -input=false -refresh=false -out=tfplan.binary

    - name: Export Terraform Plan JSON
      shell: bash
      working-directory: ${{ inputs.workload_dir }}
      run: |
        mkdir -p $GITHUB_WORKSPACE/output
        terraform show -json tfplan.binary > $GITHUB_WORKSPACE/output/tfplan.json
        mv tfplan.binary $GITHUB_WORKSPACE/output/tfplan.binary
