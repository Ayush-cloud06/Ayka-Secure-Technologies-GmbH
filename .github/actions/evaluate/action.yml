name: 'Evaluate Compliance'
description: 'Evaluate security scan results and export artifacts'

outputs:
  schema_version:
    description: 'Schema version of the summary'
    value: ${{ steps.publish-summary.outputs.schema_version }}
  decision:
    description: 'Final compliance decision (pass/fail/approval_required)'
    value: ${{ steps.publish-summary.outputs.decision }}
  approval_required:
    description: 'Whether manual approval is required'
    value: ${{ steps.publish-summary.outputs.approval_required }}
  unmapped_findings:
    description: 'Number of unmapped findings'
    value: ${{ steps.publish-summary.outputs.unmapped_findings }}

runs:
  using: 'composite'
  steps:
    - name: 🧠 Evaluate Results
      shell: bash
      run: bash Internal-IT/engineering/ci-cd/scripts/evaluate-results.sh

    - name: Publish Compliance Summary
      id: publish-summary
      shell: bash
      run: |
        if [ ! -f output/compliance-summary.json ]; then
          echo "schema_version=unknown" >> "$GITHUB_OUTPUT"
          echo "decision=error" >> "$GITHUB_OUTPUT"
          echo "approval_required=false" >> "$GITHUB_OUTPUT"
          echo "unmapped_findings=0" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        echo "schema_version=$(jq -r '.schema_version // \"unknown\"' output/compliance-summary.json)" >> "$GITHUB_OUTPUT"
        echo "decision=$(jq -r '.decision' output/compliance-summary.json)" >> "$GITHUB_OUTPUT"
        echo "approval_required=$(jq -r '.approval_required' output/compliance-summary.json)" >> "$GITHUB_OUTPUT"
        echo "unmapped_findings=$(jq -r '.metadata_coverage.unmapped_findings // 0' output/compliance-summary.json)" >> "$GITHUB_OUTPUT"

    - name: Print Compliance Coverage
      shell: bash
      run: |
        if [ -f output/compliance-summary.json ]; then
          jq '{schema_version, decision, approval_required, totals, metadata_coverage}' output/compliance-summary.json
        fi

    - name: Export Evidence
      shell: bash
      run: bash Internal-IT/engineering/ci-cd/scripts/export-evidence.sh

    - name: Upload Evidence Artifact
      uses: actions/upload-artifact@v4
      with:
        name: compliance-evidence
        path: evidence/
