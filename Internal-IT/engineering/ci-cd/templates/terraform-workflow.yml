name: Terraform Compliance Workflow
description: 'Reusable workflow for running Terraform plan and security checks'

on:
  workflow_call:
    inputs:
      workload_dir:
        description: 'Terraform workload directory'
        required: true
        type: string
      aws_region:
        description: 'AWS Region'
        required: false
        type: string
        default: 'ap-south-1'
      aws_role_arn:
        description: 'AWS Role ARN'
        required: true
        type: string
      terraform_version:
        description: 'Terraform Version'
        required: false
        type: string
        default: '1.7.5'
      artifact_name:
        description: 'Name of the artifact to upload'
        required: false
        type: string
        default: 'compliance-evidence'
      continue_on_error:
        description: 'Whether to continue on error during evaluation'
        required: false
        type: boolean
        default: false

    outputs:
      schema_version:
        description: 'Schema version of the summary'
        value: ${{ jobs.compliance.outputs.schema_version }}
      decision:
        description: 'Final compliance decision'
        value: ${{ jobs.compliance.outputs.decision }}
      approval_required:
        description: 'Whether manual approval is required'
        value: ${{ jobs.compliance.outputs.approval_required }}
      unmapped_findings:
        description: 'Number of unmapped findings'
        value: ${{ jobs.compliance.outputs.unmapped_findings }}

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Terraform Validate
        uses: ./.github/actions/validate
        with:
          workload_dir: ${{ inputs.workload_dir }}
          terraform_version: ${{ inputs.terraform_version }}

  compliance:
    needs: validate
    runs-on: ubuntu-latest
    outputs:
      schema_version: ${{ steps.decision.outputs.schema_version }}
      decision: ${{ steps.decision.outputs.decision }}
      approval_required: ${{ steps.decision.outputs.approval_required }}
      unmapped_findings: ${{ steps.decision.outputs.unmapped_findings }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Terraform Plan
        uses: ./.github/actions/plan
        with:
          workload_dir: ${{ inputs.workload_dir }}
          aws_role_arn: ${{ inputs.aws_role_arn }}
          aws_region: ${{ inputs.aws_region }}
          terraform_version: ${{ inputs.terraform_version }}

      - name: Security Check
        uses: ./.github/actions/check

      - name: Policy Check
        uses: ./.github/actions/policy

      - name: Compliance Decision
        id: decision
        uses: ./.github/actions/decision
        continue-on-error: ${{ inputs.continue_on_error }}

      - name: Compliance Evidence
        uses: ./.github/actions/evidence
        if: always()
        with:
          artifact_name: ${{ inputs.artifact_name }}
