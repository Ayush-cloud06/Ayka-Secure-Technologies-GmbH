controls:
  EC2_OPEN_SSH:
    title: "Security groups must not allow public SSH access"
    description: "Ingress on TCP/22 from 0.0.0.0/0 is treated as an internet-exposed administrative access path."
    severity: HIGH
    category: network_security
    domain: compute_security
    frameworks:
      iso27001: ["A.8.20", "A.8.21"]
    enforcement:
      tool: opa
      control_id: EC2_OPEN_SSH
      policy_package: policies.terraform.aws_ec2
    evidence:
      source: opa
      artifact: opa-result.json
    remediation:
      action: "Restrict SSH ingress to approved administrative networks or remove the rule entirely."

  S3_PUBLIC_ACCESS:
    title: "S3 buckets must not be publicly accessible"
    description: "Public-read ACLs or equivalent public exposure on S3 buckets are treated as internet data exposure."
    severity: HIGH
    category: data_security
    domain: storage_security
    frameworks:
      iso27001: ["A.8.12", "A.8.24"]
    enforcement:
      tool: opa
      control_id: S3_PUBLIC_ACCESS
      policy_package: policies.terraform.aws_s3
    evidence:
      source: opa
      artifact: opa-result.json
    remediation:
      action: "Remove public ACLs and enforce private bucket access patterns."

  EC2_MISSING_IMDSV2:
    title: "EC2 instances must enforce IMDSv2"
    description: "EC2 metadata access must require IMDSv2 to reduce SSRF-style credential exposure risk."
    severity: HIGH
    category: compute_security
    domain: instance_hardening
    frameworks:
      iso27001: ["A.8.9", "A.8.20"]
    enforcement:
      tool: opa
      control_id: EC2_MISSING_IMDSV2
      policy_package: policies.terraform.aws_ec2
    evidence:
      source: opa
      artifact: opa-result.json
    remediation:
      action: "Set metadata_options.http_tokens to required on EC2 instances."

  S3_VERSIONING_DISABLED:
    title: "S3 bucket versioning should be enabled"
    description: "Versioning improves recoverability and protection against accidental deletion or overwrite."
    severity: MEDIUM
    category: resilience
    domain: storage_resilience
    frameworks:
      iso27001: ["A.8.13", "A.5.30"]
    enforcement:
      tool: checkov
      control_id: S3_VERSIONING_DISABLED
      policy_id: CKV_AWS_21
    evidence:
      source: checkov
      artifact: checkov-result.json
    remediation:
      action: "Enable versioning on S3 buckets that store persistent or recoverable data."

  EC2_MISSING_TAGS:
    title: "EC2 instances should include mandatory governance tags"
    description: "Missing Environment, Owner, or CostCenter tags reduce governance, ownership tracking, and cost attribution."
    severity: LOW
    category: governance
    domain: asset_management
    frameworks:
      iso27001: ["A.5.9"]
    enforcement:
      tool: opa
      control_id: EC2_MISSING_TAGS
      policy_package: policies.terraform.aws_ec2
    evidence:
      source: opa
      artifact: opa-result.json
    remediation:
      action: "Add the required governance tags to each EC2 instance definition."

  S3_ENCRYPTION_MISSING:
    title: "S3 buckets should use server-side encryption"
    description: "Missing bucket encryption weakens data protection at rest and increases recovery and compliance risk."
    severity: MEDIUM
    category: data_security
    domain: storage_security
    frameworks:
      iso27001: ["A.8.24"]
    enforcement:
      tool: opa
      control_id: S3_ENCRYPTION_MISSING
      policy_package: policies.terraform.aws_s3
    evidence:
      source: opa
      artifact: opa-result.json
    remediation:
      action: "Add server-side encryption configuration for each S3 bucket."

  EC2_ROOT_VOLUME_UNENCRYPTED:
    title: "EC2 root volumes should be encrypted"
    description: "Unencrypted root volumes weaken protection of instance data at rest."
    severity: HIGH
    category: compute_security
    domain: storage_encryption
    frameworks:
      iso27001: ["A.8.24"]
    enforcement:
      tool: opa
      control_id: EC2_ROOT_VOLUME_UNENCRYPTED
      policy_package: policies.terraform.aws_ec2
    evidence:
      source: opa
      artifact: opa-result.json
    remediation:
      action: "Enable encryption on root block devices for EC2 instances."

  EC2_HTTP_OPEN:
    title: "Security groups should not expose HTTP broadly without an explicit exception"
    description: "Public HTTP exposure should be intentional and tightly governed."
    severity: MEDIUM
    category: network_security
    domain: perimeter_security
    frameworks:
      iso27001: ["A.8.20"]
    enforcement:
      tool: opa
      control_id: EC2_HTTP_OPEN
      policy_package: policies.terraform.aws_ec2
    evidence:
      source: opa
      artifact: opa-result.json
    remediation:
      action: "Restrict HTTP ingress scope or document and approve the exposure explicitly."

  EC2_PROD_UNDERSIZED_INSTANCE:
    title: "Production EC2 instances should not use undersized instance types"
    description: "Undersized production instances increase performance and resilience risk."
    severity: LOW
    category: reliability
    domain: production_readiness
    frameworks:
      iso27001: ["A.5.30"]
    enforcement:
      tool: opa
      control_id: EC2_PROD_UNDERSIZED_INSTANCE
      policy_package: policies.terraform.aws_ec2
    evidence:
      source: opa
      artifact: opa-result.json
    remediation:
      action: "Use an appropriately sized production instance class."

  EC2_PROD_SPOT_USAGE:
    title: "Production EC2 instances should not rely on Spot pricing"
    description: "Spot capacity in production creates avoidable interruption risk for critical workloads."
    severity: MEDIUM
    category: reliability
    domain: production_readiness
    frameworks:
      iso27001: ["A.5.30"]
    enforcement:
      tool: opa
      control_id: EC2_PROD_SPOT_USAGE
      policy_package: policies.terraform.aws_ec2
    evidence:
      source: opa
      artifact: opa-result.json
    remediation:
      action: "Avoid Spot market usage for production instances unless explicitly approved."

  IAM_WILDCARD_POLICY:
    title: "IAM policies must not allow wildcard actions"
    description: "Allow statements with action '*' create excessive privilege and weaken least-privilege enforcement."
    severity: HIGH
    category: identity_security
    domain: access_control
    frameworks:
      iso27001: ["A.8.2", "A.8.3"]
    enforcement:
      tool: opa
      control_id: IAM_WILDCARD_POLICY
      policy_package: policies.terraform.aws_iam
    evidence:
      source: opa
      artifact: opa-result.json
    remediation:
      action: "Replace wildcard permissions with narrowly scoped IAM actions."

  IAM_INLINE_POLICY_USAGE:
    title: "Inline IAM policies should be avoided"
    description: "Inline policies reduce central governance and make policy review harder than managed policy use."
    severity: MEDIUM
    category: identity_security
    domain: access_control
    frameworks:
      iso27001: ["A.8.2"]
    enforcement:
      tool: opa
      control_id: IAM_INLINE_POLICY_USAGE
      policy_package: policies.terraform.aws_iam
    evidence:
      source: opa
      artifact: opa-result.json
    remediation:
      action: "Use managed IAM policies instead of inline role or user policies."

  IAM_USER_PROHIBITED:
    title: "IAM users should not be provisioned in a role-based environment"
    description: "Long-lived IAM users increase credential management and compromise risk in federated environments."
    severity: HIGH
    category: identity_security
    domain: identity_governance
    frameworks:
      iso27001: ["A.5.17", "A.8.2"]
    enforcement:
      tool: opa
      control_id: IAM_USER_PROHIBITED
      policy_package: policies.terraform.aws_iam
    evidence:
      source: opa
      artifact: opa-result.json
    remediation:
      action: "Use federated access and IAM roles instead of standalone IAM users."

  IAM_USER_MFA_MISSING:
    title: "IAM users must have MFA enabled"
    description: "If IAM users exist, they must enforce MFA to reduce account takeover risk."
    severity: HIGH
    category: identity_security
    domain: authentication
    frameworks:
      iso27001: ["A.8.5"]
    enforcement:
      tool: opa
      control_id: IAM_USER_MFA_MISSING
      policy_package: policies.terraform.aws_iam
    evidence:
      source: opa
      artifact: opa-result.json
    remediation:
      action: "Attach or provision MFA devices for all remaining IAM users."

  VPC_DEFAULT_PROHIBITED:
    title: "Default VPC usage is not allowed"
    description: "Default VPCs weaken network standardization and governance compared to explicitly designed VPCs."
    severity: MEDIUM
    category: network_security
    domain: network_governance
    frameworks:
      iso27001: ["A.8.20"]
    enforcement:
      tool: opa
      control_id: VPC_DEFAULT_PROHIBITED
      policy_package: policies.terraform.aws_vpc
    evidence:
      source: opa
      artifact: opa-result.json
    remediation:
      action: "Create and use dedicated custom VPCs instead of default VPC resources."

  VPC_FLOW_LOGS_MISSING:
    title: "VPCs should have flow logs enabled"
    description: "VPC flow logs improve visibility for investigation, monitoring, and network control evidence."
    severity: MEDIUM
    category: logging_and_monitoring
    domain: network_visibility
    frameworks:
      iso27001: ["A.8.15", "A.8.16"]
    enforcement:
      tool: opa
      control_id: VPC_FLOW_LOGS_MISSING
      policy_package: policies.terraform.aws_vpc
    evidence:
      source: opa
      artifact: opa-result.json
    remediation:
      action: "Enable VPC flow logs for each managed VPC."

  ROUTE_TABLE_PUBLIC_IGW:
    title: "Route tables should not expose default routes directly to the internet"
    description: "Direct 0.0.0.0/0 internet routes increase public exposure and should be tightly controlled."
    severity: HIGH
    category: network_security
    domain: perimeter_security
    frameworks:
      iso27001: ["A.8.20", "A.8.21"]
    enforcement:
      tool: opa
      control_id: ROUTE_TABLE_PUBLIC_IGW
      policy_package: policies.terraform.aws_vpc
    evidence:
      source: opa
      artifact: opa-result.json
    remediation:
      action: "Restrict or redesign route tables so direct internet exposure is intentional and controlled."

  NETWORK_ACL_UNRESTRICTED_INGRESS:
    title: "Network ACLs must not allow unrestricted ingress"
    description: "Allowing ingress from 0.0.0.0/0 at the NACL layer creates broad network exposure."
    severity: HIGH
    category: network_security
    domain: network_hardening
    frameworks:
      iso27001: ["A.8.20", "A.8.21"]
    enforcement:
      tool: opa
      control_id: NETWORK_ACL_UNRESTRICTED_INGRESS
      policy_package: policies.terraform.aws_vpc
    evidence:
      source: opa
      artifact: opa-result.json
    remediation:
      action: "Restrict NACL ingress rules to approved CIDR ranges and required ports only."
