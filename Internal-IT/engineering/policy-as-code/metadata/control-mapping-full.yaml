controls:
  CKV_AWS_21:
    title: "S3 bucket versioning must be enabled"
    description: "Checkov gate for recoverability and protection against accidental deletion or ransomware."
    severity: HIGH
    category: data_protection
    domain: storage_security
    frameworks:
      iso27001: [ "A.8.13", "A.12.3.1" ]
      gdpr: [ "Article 32" ]
      nis2: [ "risk_management" ]
    enforcement:
      tool: checkov
      policy_id: CKV_AWS_21
    evidence:
      source: checkov
      artifact: checkov-result.json
    remediation:
      terraform: |
        versioning {
          enabled = true
        }

  S3_VERSIONING_OPA:
    title: "S3 versioning enforced via policy"
    description: "OPA policy validates Terraform changes for S3-related resources."
    severity: HIGH
    category: data_protection
    domain: storage_security
    frameworks:
      iso27001: [ "A.8.13" ]
      gdpr: [ "Article 32" ]
    enforcement:
      tool: opa
      policy_package: main
      policy_file: Internal-IT/engineering/policy-as-code/OPA/terraform/security.rego
    evidence:
      source: opa
      artifact: opa-result.json
    remediation:
      action: "Update the Terraform policy logic so the resource fails unless versioning is enabled."

  MULTI_ACCOUNT_OU_SEGREGATION:
    title: "Multi-account organizational unit segregation"
    description: "AWS Organizations OUs separate security, infrastructure, and workload accounts for governance and blast-radius control."
    severity: HIGH
    category: governance
