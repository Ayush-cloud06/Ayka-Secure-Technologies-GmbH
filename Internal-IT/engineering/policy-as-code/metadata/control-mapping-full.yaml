    evidence:
      source: terraform
      files:
      - Internal-IT/platform/foundation/aws-organization/modules/ou-structure/ous.tf
      - Internal-IT/platform/foundation/Platform_Complilance.md
    remediation:
      action: "Keep workload, infrastructure, and security accounts separated into dedicated OUs."

  SCP_DENY_ROOT_USAGE:
